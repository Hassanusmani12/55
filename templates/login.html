<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduPredict</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e5e5; }</style>
</head>
<body class="min-h-screen flex items-center justify-center antialiased relative selection:bg-amber-500/30">
    
    <!-- Background Gradient -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-900/10 via-[#050505] to-[#050505] -z-10"></div>
    
    <div class="w-full max-w-md px-8">
        
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-white/5 border border-white/10 rounded-xl mx-auto flex items-center justify-center mb-4 shadow-lg">
                <i class="fa-solid fa-graduation-cap text-amber-500 text-xl"></i>
            </div>
            <h1 class="text-2xl font-semibold tracking-tight text-white">EduPredict</h1>
            <p class="text-gray-500 text-sm mt-2">Sign in to access your dashboard</p>
        </div>

        <!-- Login Card -->
        <div class="bg-[#0f0f0f] border border-white/5 p-8 rounded-xl shadow-2xl">
            <form action="/login" method="POST" class="space-y-5">
                
                <!-- Email Input -->
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-2 uppercase tracking-wide">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-regular fa-envelope text-gray-500"></i>
                        </div>
                        <input type="email" name="email" placeholder="name@example.com" required 
                               class="w-full bg-[#1a1a1a] border border-white/10 rounded px-4 py-3 pl-11 text-white placeholder-gray-600 focus:outline-none focus:border-amber-500/50 transition-colors">
                    </div>
                </div>
                
                <!-- Password Input -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-mono text-gray-400 uppercase tracking-wide">Password</label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-500"></i>
                        </div>
                        <input type="password" name="password" placeholder="••••••••" required 
                               class="w-full bg-[#1a1a1a] border border-white/10 rounded px-4 py-3 pl-11 text-white placeholder-gray-600 focus:outline-none focus:border-amber-500/50 transition-colors">
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="w-full bg-amber-600/90 hover:bg-amber-500 text-black font-medium py-3 rounded mt-4 transition-colors shadow-[0_0_15px_rgba(217,119,6,0.3)]">
                    Authenticate
                </button>
                
            </form>
        </div>

        <!-- Footer Link -->
        <p class="text-center text-sm text-gray-500 mt-8">
            Don't have an account? 
            <a href="/signup" class="text-amber-500 hover:text-amber-400 transition-colors font-medium">Sign up</a>
        </p>
    </div>
</body>
</html>
