<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduPredict AI Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        },
                        dark: {
                            bg: '#080c14',
                            card: '#0f172a',
                            border: '#1e293b',
                            input: '#1e293b/60',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080c14; color: #f1f5f9; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 35px -5px rgba(99, 102, 241, 0.25);
        }
        .glow-effect:hover {
            box-shadow: 0 0 45px 0px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center antialiased relative selection:bg-indigo-500/30 overflow-x-hidden">
    
    <!-- Background Ambient Glow Spheres -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-violet-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-cyan-600/15 rounded-full blur-[120px]"></div>
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b12_1px,transparent_1px),linear-gradient(to_bottom,#1e293b12_1px,transparent_1px)] bg-[size:32px_32px]"></div>
    </div>
    
    <div class="w-full max-w-md px-6 py-12 relative z-10">
        
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex p-3.5 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-4 shadow-inner ring-1 ring-white/10">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center justify-center gap-2">
                Edu<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-violet-400 to-cyan-400">Predict</span>
            </h1>
            <p class="text-slate-400 text-sm mt-2 font-medium">Next-Generation Predictive Learning Analytics</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-panel p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-violet-500 to-cyan-500"></div>

            <div class="mb-6">
                <h2 class="text-xl font-bold text-white tracking-tight">Sign In</h2>
                <p class="text-slate-400 text-xs mt-1">Enter your credential details to access your dashboard</p>
            </div>

            <form action="/login" method="POST" class="space-y-5">
                
                <!-- Email Input -->
                <div>
                    <label class="block text-xs font-mono font-semibold text-slate-300 mb-2 uppercase tracking-wider">Email Address</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                            <i class="fa-regular fa-envelope text-sm"></i>
                        </div>
                        <input type="email" name="email" placeholder="name@example.com" required 
                               class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 pl-11 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200">
                    </div>
                </div>
                
                <!-- Password Input -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-mono font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" name="password" placeholder="••••••••" required 
                               class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 pl-11 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all duration-200">
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="w-full mt-2 bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3.5 px-4 rounded-xl transition-all duration-200 glow-effect flex items-center justify-center gap-2 group cursor-pointer border border-indigo-400/30">
                    <span>Authenticate</span>
                    <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                </button>
                
            </form>
        </div>

        <!-- Footer Link -->
        <p class="text-center text-sm text-slate-400 mt-8 font-medium">
            Don't have an account? 
            <a href="/signup" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors underline underline-offset-4 decoration-indigo-500/30 hover:decoration-indigo-400">Sign up</a>
        </p>
    </div>
</body>
</html>
