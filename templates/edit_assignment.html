<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Assignment | EduPredict</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e5e5; }
        /* Fix for dark mode date picker calendar icon */
        ::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen p-8 selection:bg-amber-500/30 relative flex items-center justify-center">
    
    <!-- Background Gradient -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-900/10 via-[#050505] to-[#050505] -z-10"></div>
    
    <div class="w-full max-w-2xl">
        
        <!-- Top Navigation / Back -->
        <div class="mb-6">
            <a href="/teacher" class="text-gray-400 hover:text-amber-500 transition-colors text-sm font-medium flex items-center gap-2 w-fit">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Main Form Card -->
        <div class="bg-[#0f0f0f] border border-white/5 p-8 sm:p-10 rounded-xl shadow-2xl">
            
            <div class="border-b border-white/10 pb-6 mb-8 flex items-center gap-3">
                <div class="h-10 w-10 rounded bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-500">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight text-white">Edit Assignment</h1>
                    <p class="text-gray-500 text-xs font-mono uppercase tracking-widest mt-1">Modify Task Parameters</p>
                </div>
            </div>

            <form method="POST" action="/edit_assignment/{{ assignment._id }}" class="space-y-6">
                
                <!-- Title Field -->
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-2 uppercase tracking-wide">Assignment Title</label>
                    <input type="text" name="title" value="{{ assignment.title }}" required 
                           class="w-full bg-[#1a1a1a] border border-white/10 rounded px-4 py-3 text-white focus:outline-none focus:border-amber-500/50 transition-colors">
                </div>
                
                <!-- Description Field -->
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-2 uppercase tracking-wide">Detailed Description</label>
                    <textarea name="desc" rows="4" required 
                              class="w-full bg-[#1a1a1a] border border-white/10 rounded px-4 py-3 text-white focus:outline-none focus:border-amber-500/50 transition-colors resize-none">{{ assignment.desc }}</textarea>
                </div>
                
                <!-- Two Column Grid for Date & Marks -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-2 uppercase tracking-wide">Due Date</label>
                        <input type="date" name="due_date" value="{{ assignment.due_date }}" required 
                               class="w-full bg-[#1a1a1a] border border-white/10 rounded px-4 py-3 text-gray-300 focus:outline-none focus:border-amber-500/50 transition-colors">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-mono text-gray-400 mb-2 uppercase tracking-wide">Total Marks</label>
                        <input type="number" name="marks" value="{{ assignment.marks }}" required min="1"
                               class="w-full bg-[#1a1a1a] border border-white/10 rounded px-4 py-3 text-white focus:outline-none focus:border-amber-500/50 transition-colors">
                    </div>
                </div>
                
                <!-- Status Dropdown -->
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-2 uppercase tracking-wide">Status</label>
                    <div class="relative">
                        <select name="status" class="w-full bg-[#1a1a1a] border border-white/10 rounded px-4 py-3 text-white focus:outline-none focus:border-amber-500/50 transition-colors appearance-none cursor-pointer">
                            <option value="active" {% if assignment.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="closed" {% if assignment.status == 'closed' %}selected{% endif %}>Closed</option>
                        </select>
                        <!-- Custom dropdown arrow -->
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="pt-6 mt-6 border-t border-white/5 flex gap-4 justify-end">
                    <a href="/teacher" class="px-6 py-2.5 rounded border border-white/10 text-gray-300 hover:bg-white/5 transition-colors font-medium text-sm flex items-center justify-center">
                        Cancel
                    </a>
                    <button type="submit" class="bg-amber-600/90 hover:bg-amber-500 text-black font-medium px-8 py-2.5 rounded transition-colors text-sm shadow-[0_0_15px_rgba(217,119,6,0.3)]">
                        Update Assignment
                    </button>
                </div>

            </form>
        </div>
    </div>
</body>
</html>
