<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Success | EduPredict</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e5e5; }</style>
</head>
<body class="min-h-screen flex items-center justify-center antialiased relative selection:bg-amber-500/30">
    
    <!-- Background Gradient Matching the Portal -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-900/10 via-[#050505] to-[#050505] -z-10"></div>
    
    <div class="bg-[#0f0f0f] border border-white/5 p-10 rounded-xl shadow-2xl w-full max-w-sm text-center relative overflow-hidden">
        
        <!-- Top Amber Accent Line -->
        <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent"></div>
        
        <!-- Animated Icon Container -->
        <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/20 rounded-full mx-auto flex items-center justify-center mb-6 shadow-[0_0_15px_rgba(217,119,6,0.2)]">
            <i class="fa-solid fa-check text-amber-500 text-lg"></i>
        </div>
        
        <h1 class="text-xl font-semibold text-white mb-2 tracking-tight">Identity Verified</h1>
        
        <p class="text-gray-500 text-sm mb-8">Session established for <span class="text-white font-mono block mt-1">{{ session.get('user', 'User') }}</span></p>
        
        <a href="/login" class="block w-full bg-amber-600/90 hover:bg-amber-500 text-black text-sm font-medium py-3 rounded transition-colors shadow-[0_0_15px_rgba(217,119,6,0.3)]">
            Enter Portal
        </a>
    </div>
</body>
</html>
